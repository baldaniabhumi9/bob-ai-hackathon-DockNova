submission:
  title: "DockNova — AI-Powered Port Congestion Predictor & Operations Optimiser"

  problem_statement: >
    Port operators often manage vessel arrivals, berth allocation, crane
    availability, and yard capacity using fragmented schedules and manual
    planning. This makes congestion difficult to identify before vessels begin
    queuing and causes operational decisions such as berth reassignment,
    resource allocation, and alternate routing to happen too late.

  solution_summary: >
    DockNova is an AI-powered port operations control tower that predicts
    congestion hotspots up to 72 hours in advance using vessel schedules,
    berth capacity, crane availability, and operational data. It explains the
    causes of predicted congestion, recommends optimised berth and crane
    assignments and alternate routing strategies, enables what-if simulation
    of operational decisions, and generates an actionable 72-hour plan for
    shift supervisors through an IBM Bob-powered conversational interface.

  key_features:
    - "72-hour vessel and port congestion prediction with risk levels"
    - "Explainable AI showing the factors driving each congestion prediction"
    - "AI-optimised berth and crane assignment recommendations"
    - "What-if simulation for vessel delays, early arrivals, and resource changes"
    - "Alternate routing recommendations and congestion impact analysis"
    - "Automated 72-hour port operations plan for shift supervisors"
    - "Interactive port control tower with vessel, berth, crane, and congestion views"
    - "IBM Bob-powered AI Port Copilot for natural-language operational queries"

  tech_stack:
    languages:
      - "Python"
      - "TypeScript"

    frameworks:
      - "FastAPI"
      - "React"

    ibm_technologies:
      - "IBM Bob"
      - "watsonx.ai"

    databases:
      - "PostgreSQL"

    other:
      - "Docker"
      - "GitHub Actions"

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    Replace with what aspect of the submission you consider strongest
    and want judges to pay special attention to.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Replace with any known limitations, incomplete features,
    or shortcuts taken due to time constraints.

